<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>أحمد – بورتفوليو احترافي</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #ffd700;
      --bg-dark: #080808;
      --card-bg: rgba(20, 20, 20, 0.85);
      --text-muted: #a0a0a0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background: radial-gradient(circle at top right, #1a1a1a, #000);
      color: #ffffff;
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
    }

    .container { max-width: 950px; margin: 0 auto; }

    /* الشعار الموحد المبتكر */
    .brand-section {
      text-align: center;
      margin-bottom: 50px;
      padding-top: 20px;
    }

    .unified-logo {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; /* شكل هندسي مميز */
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
      animation: morph 8s linear infinite;
    }

    @keyframes morph {
      0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
      50% { border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%; }
    }

    .logo-icons-container {
      position: relative;
      font-size: 1.8rem;
      color: var(--primary);
    }

    /* توزيع الأيقونات حول الرمز البرمجي المركزي */
    .central-code {
      font-weight: 700;
      font-size: 2rem;
      text-shadow: 0 0 10px var(--primary);
    }

    .sub-icon {
      position: absolute;
      font-size: 0.9rem;
      background: #000;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--primary);
    }

    .ic-camera { top: -35px; left: 50%; transform: translateX(-50%); }
    .ic-brush { bottom: -35px; left: 50%; transform: translateX(-50%); }
    .ic-mouse { top: 50%; left: -35px; transform: translateY(-50%); }

    .logo-title { 
      font-size: 2.4rem; 
      color: var(--primary); 
      font-weight: 700;
      margin-top: 10px;
    }

    /* شريط اللغة */
    .lang-bar { text-align: center; margin-bottom: 30px; }
    .lang-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.3);
      padding: 6px 20px;
      border-radius: 20px;
      color: #fff;
      cursor: pointer;
      margin: 0 5px;
    }
    .lang-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

    /* البطاقات الزجاجية */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 35px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h2 { color: var(--primary); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    
    .project-item {
        background: rgba(255, 255, 255, 0.02);
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 15px;
        border-right: 4px solid var(--primary);
    }
    [dir="ltr"] .project-item { border-right: none; border-left: 4px solid var(--primary); }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }
    .skill-card {
      background: rgba(255, 255, 255, 0.03);
      padding: 15px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid transparent;
    }
    .skill-card:hover { border-color: var(--primary); background: rgba(255, 215, 0, 0.05); }
    .skill-card i { color: var(--primary); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      background: var(--primary);
      color: #000;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      margin-top: 15px;
    }

    footer { text-align: center; padding: 40px 0; color: #555; }
  </style>
</head>
<body>

  <div class="brand-section">
    <!-- الشعار الموحد الذكي -->
    <div class="unified-logo">
      <div class="logo-icons-container">
        <span class="central-code">&lt;/&gt;</span>
        <div class="sub-icon ic-camera"><i class="fas fa-camera"></i></div>
        <div class="sub-icon ic-brush"><i class="fas fa-paint-brush"></i></div>
        <div class="sub-icon ic-mouse"><i class="fas fa-mouse"></i></div>
      </div>
    </div>
    <div class="logo-title" id="main-name">أحمد – بورتفوليو</div>
  </div>

  <div class="lang-bar">
    <button class="lang-btn active" id="btn-ar" onclick="setLang('ar')">العربية</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">English</button>
  </div>

  <div class="container">
    <section class="glass-card">
      <h1 id="h-name" style="color: var(--primary); font-size: 2.2rem;">أحمد</h1>
      <p id="h-title" style="color: #fff; margin: 10px 0; font-weight: 500;"></p>
      <p id="h-desc"></p>
      <a href="#" class="btn" id="h-btn"><i class="fas fa-download"></i> <span></span></a>
    </section>

    <section class="glass-card">
      <h2 id="p-title"><i class="fas fa-code-branch"></i> <span></span></h2>
      <div id="projects-list"></div>
    </section>

    <section class="glass-card">
      <h2 id="s-title"><i class="fas fa-layer-group"></i> <span></span></h2>
      <div class="skills-grid" id="skills-grid"></div>
    </section>

    <section class="glass-card">
      <h2 id="c-title"><i class="fas fa-paper-plane"></i> <span></span></h2>
      <p id="c-desc"></p>
      <div style="margin-top: 15px;">
        <a href="mailto:ahmedegili77@gmail.com" style="color: var(--primary); text-decoration: none;">
          <i class="fas fa-envelope"></i> ahmedegili77@gmail.com
        </a>
      </div>
    </section>

    <footer id="footer-text"></footer>
  </div>

  <script>
    const content = {
      ar: {
        dir: "rtl",
        logoTitle: "أحمد – بورتفوليو",
        home: { name: "أحمد", title: "مطور برمجيات وشبكات • مصمم UI/UX", desc: "أجمع بين قوة البرمجة بـ Python، وهندسة شبكات الميكروتك، وإبداع التصميم البصري في هوية واحدة.", btn: "تحميل السيرة الذاتية" },
        projects: {
          title: "المشاريع المميزة",
          items: [
            { h: "أتمتة شبكات الميكروتك", p: "بناء أنظمة لتوليد القسائم وإدارة المستخدمين عبر بوتات برمجية ذكية." },
            { h: "تطوير بوتات بايثون", p: "حلول برمجية مخصصة لأتمتة المهام الإدارية والتفاعل التلقائي." },
            { h: "تصميم الهويات الرقمية", p: "تصميم واجهات احترافية وشعارات تعكس قوة العلامة التجارية." }
          ]
        },
        skills: [
          { n: "Web Development", i: "fa-brands fa-js" },
          { n: "Python Scripting", i: "fa-brands fa-python" },
          { n: "UI/UX Design", i: "fas fa-wand-magic-sparkles" },
          { n: "Mikrotik OS", i: "fas fa-network-wired" },
          { n: "Graphic Design", i: "fas fa-palette" },
          { n: "Ruijie Systems", i: "fas fa-broadcast-tower" }
        ],
        skillsTitle: "الخبرات التقنية",
        contact: { title: "تواصل معي", desc: "هل لديك مشروع طموح؟ دعنا نحوله إلى واقع." },
        footer: "© 2026 أحمد – دمج الفن بالتقنية 🪶"
      },
      en: {
        dir: "ltr",
        logoTitle: "Ahmed – Portfolio",
        home: { name: "Ahmed", title: "Dev & Networks • UI/UX Designer", desc: "Merging Python programming, Mikrotik networking, and visual design into a single identity.", btn: "Download CV" },
        projects: {
          title: "Featured Projects",
          items: [
            { h: "Mikrotik Automation", p: "Building systems for voucher generation and user management via smart bots." },
            { h: "Python Bot Development", p: "Custom software solutions for automating admin tasks and interactions." },
            { h: "Digital Identity Design", p: "Professional UI and logo design that reflects brand strength." }
          ]
        },
        skills: [
          { n: "Web Development", i: "fa-brands fa-js" },
          { n: "Python Scripting", i: "fa-brands fa-python" },
          { n: "UI/UX Design", i: "fas fa-wand-magic-sparkles" },
          { n: "Mikrotik OS", i: "fas fa-network-wired" },
          { n: "Graphic Design", i: "fas fa-palette" },
          { n: "Ruijie Systems", i: "fas fa-broadcast-tower" }
        ],
        skillsTitle: "Technical Skills",
        contact: { title: "Contact Me", desc: "Have an ambitious project? Let's make it a reality." },
        footer: "© 2026 Ahmed – Merging Art with Tech 🪶"
      }
    };

    function setLang(lang) {
      const d = content[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = d.dir;

      document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      document.getElementById('main-name').textContent = d.logoTitle;
      document.getElementById('h-name').textContent = d.home.name;
      document.getElementById('h-title').textContent = d.home.title;
      document.getElementById('h-desc').textContent = d.home.desc;
      document.getElementById('h-btn').querySelector('span').textContent = d.home.btn;

      document.getElementById('p-title').querySelector('span').textContent = d.projects.title;
      document.getElementById('projects-list').innerHTML = d.projects.items.map(item => `
        <div class="project-item">
            <h3>${item.h}</h3>
            <p>${item.p}</p>
        </div>
      `).join('');

      document.getElementById('s-title').querySelector('span').textContent = d.skillsTitle;
      document.getElementById('skills-grid').innerHTML = d.skills.map(s => `
        <div class="skill-card">
            <i class="${s.i}"></i>
            <span>${s.n}</span>
        </div>
      `).join('');

      document.getElementById('c-title').querySelector('span').textContent = d.contact.title;
      document.getElementById('c-desc').textContent = d.contact.desc;
      document.getElementById('footer-text').textContent = d.footer;
    }

    setLang('ar');
  </script>
</body>
</html>

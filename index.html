<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>أحمد العامري – بورتفوليو احترافي</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      /* لوحة ألوان احترافية: ذهبي مطفي + أسود فحم + رمادي تقني */
      --primary: #FFC107; /* ذهبي دافئ واحترافي */
      --primary-hover: #FFB300;
      --bg-dark: #0F0F0F; /* أسود فحمي مريح للعين */
      --card-bg: rgba(30, 30, 30, 0.7); /* خلفية بطاقات زجاجية أغمق قليلاً */
      --text-main: #FFFFFF;
      --text-muted: #BDBDBD;
      --border-color: rgba(255, 193, 7, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
      transition: all 0.3s ease;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 193, 7, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(255, 193, 7, 0.05) 0%, transparent 20%);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
    }

    .container { max-width: 950px; margin: 0 auto; }

    /* الشعار الموحد */
    .brand-section {
      text-align: center;
      margin-bottom: 50px;
      padding-top: 20px;
    }

    .unified-logo {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(255, 193, 7, 0.1);
      transform: rotate(-5deg);
    }

    .unified-logo:hover {
      transform: rotate(0deg) scale(1.05);
      border-color: var(--primary-hover);
    }

    .logo-icons-container {
      position: relative;
      font-size: 1.8rem;
      color: var(--primary);
    }

    .central-code {
      font-weight: 700;
      font-size: 2.2rem;
      letter-spacing: -2px;
    }

    .sub-icon {
      position: absolute;
      font-size: 0.9rem;
      background: #1a1a1a;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .ic-camera { top: -45px; left: 50%; transform: translateX(-50%); }
    .ic-brush { bottom: -45px; left: 50%; transform: translateX(-50%); }
    .ic-mouse { top: 50%; left: -45px; transform: translateY(-50%); }

    .logo-title { 
      font-size: 2.4rem; 
      color: var(--primary); 
      font-weight: 700;
      margin-top: 15px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    /* شريط اللغة */
    .lang-bar { text-align: center; margin-bottom: 30px; }
    .lang-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 7px 22px;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      margin: 0 5px;
      font-weight: 500;
    }
    .lang-btn.active { 
      background: var(--primary); 
      color: #000; 
      border-color: var(--primary); 
      box-shadow: 0 4px 12px rgba(255, 193, 7, 0.2);
    }

    /* البطاقات الزجاجية */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      padding: 35px;
      margin-bottom: 25px;
    }

    h2 { color: var(--primary); margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-size: 1.5rem; }
    
    .project-item {
        background: rgba(255, 255, 255, 0.02);
        padding: 25px;
        border-radius: 12px;
        margin-bottom: 20px;
        border-right: 4px solid var(--primary);
    }
    [dir="ltr"] .project-item { border-right: none; border-left: 4px solid var(--primary); }

    .project-item h3 { margin-bottom: 10px; color: #fff; }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }
    .skill-card {
      background: rgba(0, 0, 0, 0.2);
      padding: 18px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid transparent;
    }
    .skill-card:hover { 
      border-color: var(--primary); 
      background: rgba(255, 193, 7, 0.05);
      transform: translateY(-5px);
    }
    .skill-card i { color: var(--primary); font-size: 1.3rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      background: var(--primary);
      color: #000;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      margin-top: 15px;
    }
    .btn:hover { background: var(--primary-hover); box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3); }

    footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; letter-spacing: 1px; }
  </style>
</head>
<body>

  <div class="brand-section">
    <div class="unified-logo">
      <div class="logo-icons-container">
        <span class="central-code">&lt;/&gt;</span>
        <div class="sub-icon ic-camera"><i class="fas fa-camera"></i></div>
        <div class="sub-icon ic-brush"><i class="fas fa-paint-brush"></i></div>
        <div class="sub-icon ic-mouse"><i class="fas fa-mouse"></i></div>
      </div>
    </div>
    <div class="logo-title" id="main-name">أحمد – بورتفوليو</div>
  </div>

  <div class="lang-bar">
    <button class="lang-btn active" id="btn-ar" onclick="setLang('ar')">العربية</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">English</button>
  </div>

  <div class="container">
    <section class="glass-card">
      <h1 id="h-name" style="color: var(--primary); font-size: 2.5rem; margin-bottom: 5px;">أحمد</h1>
      <p id="h-title" style="color: #fff; margin-bottom: 15px; font-weight: 500; font-size: 1.2rem;"></p>
      <p id="h-desc" style="color: var(--text-muted);"></p>
      <a href="#" class="btn" id="h-btn"><i class="fas fa-cloud-download-alt"></i> <span></span></a>
    </section>

    <section class="glass-card">
      <h2 id="p-title"><i class="fas fa-layer-group"></i> <span></span></h2>
      <div id="projects-list"></div>
    </section>

    <section class="glass-card">
      <h2 id="s-title"><i class="fas fa-terminal"></i> <span></span></h2>
      <div class="skills-grid" id="skills-grid"></div>
    </section>

    <section class="glass-card">
      <h2 id="c-title"><i class="fas fa-comments"></i> <span></span></h2>
      <p id="c-desc" style="margin-bottom: 15px;"></p>
      <a href="mailto:ahmedegili77@gmail.com" style="color: var(--primary); text-decoration: none; font-weight: 500; border-bottom: 1px dashed var(--primary);">
        <i class="fas fa-envelope-open-text"></i> ahmedegili77@gmail.com
      </a>
    </section>

    <footer id="footer-text"></footer>
  </div>

  <script>
    const content = {
      ar: {
        dir: "rtl",
        logoTitle: "أحمد – بورتفوليو",
        home: { name: "أحمد", title: "مطور برمجيات وشبكات • مصمم UI/UX", desc: "خبير في تطويع التقنية لخدمة احتياجاتك، من إدارة الشبكات المتقدمة إلى بناء واجهات رقمية تلفت الأنظار.", btn: "تحميل السيرة الذاتية" },
        projects: {
          title: "المشاريع الرئيسية",
          items: [
            { h: "أتمتة شبكات الميكروتك", p: "بناء أنظمة لتوليد القسائم وإدارة المستخدمين بشكل منظم وجيد." },
            { h: "صنع بوتات مخصصة", p: "صنع بوتات تقوم بمهام معينة حسب رغبتك، مع حلول برمجية مخصصة لأتمتة المهام الإدارية والتفاعل التلقائي." },
            { h: "هندسة الواجهات (UI/UX)", p: "تصميم تجارب مستخدم تدمج بين الجمالية الرقمية وسهولة التصفح." }
          ]
        },
        skills: [
          { n: "Web Technologies", i: "fab fa-html5" },
          { n: "Python Master", i: "fab fa-python" },
          { n: "UX/UI Strategy", i: "fas fa-drafting-compass" },
          { n: "Mikrotik Expert", i: "fas fa-network-wired" },
          { n: "Visual Branding", i: "fas fa-pen-fancy" },
          { n: "Network Security", i: "fas fa-shield-alt" }
        ],
        skillsTitle: "القدرات التقنية",
        contact: { title: "تواصل معي", desc: "دعنا نناقش فكرتك القادمة ونحولها إلى نظام يعمل بكفاءة:" },
        footer: "© 2026 أحمد – التميز في الكود والتصميم"
      },
      en: {
        dir: "ltr",
        logoTitle: "Ahmed – Portfolio",
        home: { name: "Ahmed", title: "Dev & Networks • UI/UX Designer", desc: "Expert in tailoring technology to your needs, from advanced network management to building eye-catching digital interfaces.", btn: "Download CV" },
        projects: {
          title: "Key Projects",
          items: [
            { h: "Mikrotik Automation", p: "Building systems for voucher generation and user management in an organized and efficient manner." },
            { h: "Custom Bot Creation", p: "Crafting bots that perform specific tasks according to your desire, with custom software solutions for admin automation." },
            { h: "Interface Engineering", p: "Designing user experiences that merge digital aesthetics with ease of navigation." }
          ]
        },
        skills: [
          { n: "Web Technologies", i: "fab fa-html5" },
          { n: "Python Master", i: "fab fa-python" },
          { n: "UX/UI Strategy", i: "fas fa-drafting-compass" },
          { n: "Mikrotik Expert", i: "fas fa-network-wired" },
          { n: "Visual Branding", i: "fas fa-pen-fancy" },
          { n: "Network Security", i: "fas fa-shield-alt" }
        ],
        skillsTitle: "Technical Skills",
        contact: { title: "Get in Touch", desc: "Let's discuss your next idea and turn it into an efficient system:" },
        footer: "© 2026 Ahmed – Excellence in Code & Design"
      }
    };

    function setLang(lang) {
      const d = content[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = d.dir;

      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-' + lang).classList.add('active');

      document.getElementById('main-name').textContent = d.logoTitle;
      document.getElementById('h-name').textContent = d.home.name;
      document.getElementById('h-title').textContent = d.home.title;
      document.getElementById('h-desc').textContent = d.home.desc;
      document.getElementById('h-btn').querySelector('span').textContent = d.home.btn;

      document.getElementById('p-title').querySelector('span').textContent = d.projects.title;
      document.getElementById('projects-list').innerHTML = d.projects.items.map(item => `
        <div class="project-item">
            <h3>${item.h}</h3>
            <p>${item.p}</p>
        </div>
      `).join('');

      document.getElementById('s-title').querySelector('span').textContent = d.skillsTitle;
      document.getElementById('skills-grid').innerHTML = d.skills.map(s => `
        <div class="skill-card">
            <i class="${s.i}"></i>
            <span>${s.n}</span>
        </div>
      `).join('');

      document.getElementById('c-title').querySelector('span').textContent = d.contact.title;
      document.getElementById('c-desc').textContent = d.contact.desc;
      document.getElementById('footer-text').textContent = d.footer;
    }

    setLang('ar');
  </script>
</body>
</html>
